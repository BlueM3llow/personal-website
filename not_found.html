<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[CharcotWilbrand]</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/not-found.css" />
    <style>
      html {
        background-image: linear-gradient(rgb(7, 1, 19), rgb(17, 3, 43));
      }

      body {
        display: flex;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      .main {
        width: 30%;
        margin: 2rem auto;
        color: var(--textCol);
        text-align: center;
      }

      @media all and (max-width: 1000px) {
        h1 {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="main">
      <h1 id="rdmTxt"></h1>
      <a style="opacity: 50%" href="/index.html">Wake up</a>
    </main>
    <script>
      const textOptions = ["No dreams to look forward to", "Quiet night", "REM disrupted", "Insomnia", "Dreams will come by", "Fatigue", "Caffeine", "Blue Light"];
      const randomIndex = Math.floor(Math.random() * textOptions.length);
      document.getElementById("rdmTxt").textContent = textOptions[randomIndex];
    </script>
  </body>
</html>
